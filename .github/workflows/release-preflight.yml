name: Release Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  RUST_TEST_THREADS: "2"
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  preflight:
    name: Full release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare isolated runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Provision pinned Lean dependencies
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/hxrts/projects
          sudo chown -R "$USER":"$USER" /Users/hxrts
          nix develop --command bash scripts/bootstrap/dependency-checkouts.sh
      - name: Run complete canonical release preflight
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/preflight-commit.txt
          nix develop --command just ci-dry-run 2>&1 | tee artifacts/release-preflight.log
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
